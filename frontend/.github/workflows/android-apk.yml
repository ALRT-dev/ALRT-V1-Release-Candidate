# Builds an installable Android APK in the cloud on every push to the review
# branch (or on demand via the "Run workflow" button). Download it from the
# run's Artifacts section: repo -> Actions -> newest "Android APK" run.
#
# Repo secrets used (Settings -> Secrets and variables -> Actions):
#   GOOGLE_MAPS_API_KEY            required for the map to render
#   GOOGLE_OAUTH_SERVER_CLIENT_ID  optional (Google sign-in)
#   REVENUECAT_API_KEY_GOOGLE      optional (ALRT+ paywall)
#   REVENUECAT_API_KEY_APPLE       optional (unused on Android)
#
# The APK is signed with a debug key: perfect for installing on your own
# phone, not acceptable for the Play Store — see android-release.yml for the
# production-signed .aab pipeline.
name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [claude/safety-alert-repo-audit-8exgvn]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.10"
          channel: stable
          cache: true

      - name: Create .env from repo secrets
        run: |
          {
            echo "GOOGLE_OAUTH_SERVER_CLIENT_ID=${{ secrets.GOOGLE_OAUTH_SERVER_CLIENT_ID }}"
            echo "GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY || secrets.googlemaps }}"
            echo "MICROSOFT_CLIENT_ID="
            echo "MICROSOFT_TENANT_ID="
            echo "REVENUECAT_API_KEY_APPLE=${{ secrets.REVENUECAT_API_KEY_APPLE }}"
            echo "REVENUECAT_API_KEY_GOOGLE=${{ secrets.REVENUECAT_API_KEY_GOOGLE }}"
            echo "DEV_BASE_URL=https://api.safetyalrt.com"
            echo "ALRT_PLUS_TEST_UNLOCK=true"
          } > .env

      - run: flutter pub get

      # Dev flavour: installs ALONGSIDE the store app ([Dev] ALRT, .dev app id)
      # instead of replacing it. DEV_BASE_URL points it at the production API.
      - run: flutter build apk --release --flavor dev -t lib/main_dev.dart
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY || secrets.googlemaps }}

      - uses: actions/upload-artifact@v4
        with:
          name: ALRT-android-apk
          path: build/app/outputs/flutter-apk/app-dev-release.apk
          retention-days: 14

      # Publish to a fixed public URL so a QR code can point straight at the
      # APK: https://github.com/ALRT-dev/widget/releases/download/dev-latest/app-dev-release.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-latest
          name: "[Dev] ALRT — latest Android test build"
          prerelease: true
          body: "Scan-to-install test build. Installs alongside the store app as [Dev] ALRT. Not for the Play Store."
          files: build/app/outputs/flutter-apk/app-dev-release.apk
