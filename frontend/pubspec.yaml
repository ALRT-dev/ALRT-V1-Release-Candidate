name: hazard_app
description: "A new Flutter project."

publish_to: "none"

version: 1.0.5+35

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.0.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  go_router: ^16.2.1
  flutter_screenutil: ^5.9.3
  dio: ^5.9.0
  dio_smart_retry: ^7.0.1
  retrofit: ^4.7.2
  connectivity_plus: ^7.0.0
  internet_connection_checker: ^3.0.1
  shared_preferences: ^2.5.3
  easy_localization: ^3.0.8
  google_sign_in: ^7.2.0
  google_sign_in_web: ^1.1.0
  flutter_dotenv: ^6.0.0
  flutter_svg: ^2.2.1
  toastification: ^3.0.3
  google_maps_flutter: ^2.13.1
  google_maps_cluster_manager_2: ^3.2.0
  flutter_polyline_points: ^3.1.0
  cached_network_image: ^3.4.1
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  app_settings: ^6.1.1
  timeago: ^3.7.1
  widget_to_marker: ^1.0.6
  easy_debounce: ^2.0.3
  flutter_datetime_picker_plus: ^2.2.0
  intl: ^0.20.2
  image_picker: ^1.2.0
  uuid: ^4.5.1
  mime: ^2.0.0
  collection: ^1.19.1
  flutter_compass: ^0.8.1
  firebase_core: ^4.1.1
  firebase_messaging: ^16.0.2
  cloud_functions: ^6.0.0
  socket_io_client: ^3.1.2
  carousel_slider: ^5.1.1
  flutter_cache_manager: ^3.4.1
  native_video_player: ^4.0.1
  visibility_detector: ^0.4.0+2
  url_launcher: ^6.3.2
  sign_in_with_apple: ^7.0.1
  lucide_icons_flutter: ^3.1.7
  msal_auth: ^3.3.0
  google_fonts: ^6.2.1
  flutter_local_notifications: ^18.0.1
  share_plus: ^13.2.0
  in_app_review: ^2.0.12
  firebase_analytics: ^12.4.3
  auto_size_text: ^3.0.0
  speech_to_text: ^7.0.0
  purchases_flutter: ^10.4.3
  home_widget: ^0.7.0
  qr_flutter: ^4.1.0
  flutter_tts: ^4.2.5
  firebase_auth: ^6.5.7
  firebase_app_check: ^0.4.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.8.0
  freezed: ^3.2.3
  json_serializable: ^6.11.1
  retrofit_generator: ^10.0.5
  flutter_launcher_icons: ^0.14.4

dependency_overrides:
  build_runner: ^2.7.1
  connectivity_plus: ^7.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/msal_config.json
    - assets/translations/
    - assets/logos/
    - assets/icons/
    - assets/images/
    - assets/images/hazards/
    - assets/images/hazards/aws/
    - assets/images/hazards/non_aws/
    - assets/pins/
    - assets/launcher_icons/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins/Poppins-Thin.ttf
          weight: 100
        - asset: assets/fonts/Poppins/Poppins-ThinItalic.ttf
          weight: 100
          style: italic
        - asset: assets/fonts/Poppins/Poppins-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Poppins/Poppins-ExtraLightItalic.ttf
          weight: 200
          style: italic
        - asset: assets/fonts/Poppins/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins/Poppins-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/Poppins/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins/Poppins-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Poppins/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins/Poppins-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/Poppins/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins/Poppins-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/Poppins/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins/Poppins-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/Poppins/Poppins-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Poppins/Poppins-ExtraBoldItalic.ttf
          weight: 800
          style: italic
        - asset: assets/fonts/Poppins/Poppins-Black.ttf
          weight: 900
        - asset: assets/fonts/Poppins/Poppins-BlackItalic.ttf
          weight: 900
          style: italic
