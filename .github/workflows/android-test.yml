ingroup# Builds an installable Android APK pointed at the ISOLATED INTERNAL-TEST
# backend, not production. This is a NEW, separate workflow — it does not
# modify android-apk.yml (still production-connected, unchanged) or
# android-release.yml (the real Play release pipeline, unchanged).
#
# This is the repo-root copy of frontend/.github/workflows/android-test.yml,
# adapted for this monorepo's layout - GitHub Actions only ever discovers
# workflows at .github/workflows/ on the actual repository root, so the
# nested copy (a leftover of frontend/ being imported wholesale from the
# original frontendV2 repo, where that path WAS the repo root) is invisible
# to GitHub Actions and can never be dispatched. The nested file is left
# in place, untouched - this is a new, separate file, not a move.
#
# Uses the existing "dev" flavour (com.safetyalrt.alrt.dev) exactly as
# android-apk.yml does — same app id, same Firebase app, same debug
# signing. The ONLY difference is which backend DEV_BASE_URL points at:
# this workflow sends it to the isolated test backend (Stage A,
# V1_RECONCILIATION_REPORT.md) instead of https://api.safetyalrt.com.
#
# Manual trigger only (workflow_dispatch) — deliberately does not run on
# push, so it never fires accidentally before the "test" GitHub
# Environment and its secrets actually exist.
#
# Requires a GitHub Environment named "test" (Settings -> Environments ->
# New environment -> "test") with this secret defined on it:
#   TEST_BACKEND_URL   the isolated test backend's public URL, e.g.
#                       https://api-test.safetyalrt.com (not a secret value
#                       in the sensitive sense — same class as the
#                       already-public production API hostname — scoped to
#                       the environment for tidiness, not because it needs
#                       hiding)
#
# Everything else (Maps, Google Sign-In, RevenueCat SDK keys) intentionally
# reuses the SAME repo-level secrets android-apk.yml already uses — Stage A
# does not migrate the Google Maps key or touch RevenueCat production
# webhooks, per V1_RECONCILIATION_REPORT.md. ALRT_PLUS_TEST_UNLOCK=true
# bypasses RevenueCat entirely for entitlement checks (already-existing
# mechanism, see alrt_plus_provider.dart) — no real purchase-flow testing
# happens via this workflow.
name: Android Test Build

on:
  workflow_dispatch:

# The actual Flutter project lives in frontend/, not the repo root, since
# this repo consolidates backend/frontend/admin/askalrt as subdirectories.
# This applies to every `run:` step below (flutter pub get, the .env
# write, flutter build apk) - it does NOT affect actions/checkout,
# actions/setup-java, subosito/flutter-action (none of them read/write
# repo-relative files, so working-directory doesn't apply to them), or
# actions/upload-artifact's `path:` (that one always resolves against the
# checkout root regardless of this default, hence the explicit `frontend/`
# prefix on it below).
defaults:
  run:
    working-directory: frontend

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: test
    steps:
      - uses: actions/checkout@v4

      - name: Verify the isolated test backend URL is configured
        run: |
          if [ -z "${{ secrets.TEST_BACKEND_URL }}" ]; then
            echo "::error::TEST_BACKEND_URL is not set on the 'test' GitHub Environment."
            echo "This workflow refuses to fall back to any default backend URL for a test build."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.10"
          channel: stable
          cache: true

      - name: Create .env pointed at the isolated test backend
        run: |
          {
            echo "GOOGLE_OAUTH_SERVER_CLIENT_ID=${{ secrets.GOOGLE_OAUTH_SERVER_CLIENT_ID }}"
            echo "GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY || secrets.googlemaps }}"
            echo "MICROSOFT_CLIENT_ID="
            echo "MICROSOFT_TENANT_ID="
            echo "REVENUECAT_API_KEY_APPLE=${{ secrets.REVENUECAT_API_KEY_APPLE }}"
            echo "REVENUECAT_API_KEY_GOOGLE=${{ secrets.REVENUECAT_API_KEY_GOOGLE }}"
            echo "DEV_BASE_URL=${{ secrets.TEST_BACKEND_URL }}"
            echo "ALRT_PLUS_TEST_UNLOCK=true"
          } > .env

      - run: flutter pub get

      # Same dev flavour/app id as android-apk.yml - only DEV_BASE_URL
      # differs, via the .env written above.
      - run: flutter build apk --release --flavor dev -t lib/main_dev.dart
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY || secrets.googlemaps }}

      # Workflow artifact only - deliberately does NOT publish to the
      # dev-latest GitHub Release android-apk.yml owns, so this can never
      # overwrite the existing production-connected QR-code build. Path is
      # explicitly prefixed with frontend/ since upload-artifact resolves
      # `path:` against the checkout root, not the working-directory
      # default above.
      - uses: actions/upload-artifact@v4
        with:
          name: ALRT-android-test-apk
          path: frontend/build/app/outputs/flutter-apk/app-dev-release.apk
          retention-days: 14
