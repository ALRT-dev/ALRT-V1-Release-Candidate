# Builds an installable Android APK pointed at the ISOLATED INTERNAL-TEST
# backend, not production. This is a NEW, separate workflow — it does not
# modify android-apk.yml (still production-connected, unchanged) or
# android-release.yml (the real Play release pipeline, unchanged).
#
# This is the repo-root copy of frontend/.github/workflows/android-test.yml,
# adapted for this monorepo's layout - GitHub Actions only ever discovers
# workflows at .github/workflows/ on the actual repository root, so the
# nested copy (a leftover of frontend/ being imported wholesale from the
# original frontendV2 repo, where that path WAS the repo root) is invisible
# to GitHub Actions and can never be dispatched. The nested file is left
# in place, untouched - this is a new, separate file, not a move.
#
# Uses the existing "dev" flavour (com.safetyalrt.alrt.dev) exactly as
# android-apk.yml does — same app id, same Firebase app, same debug
# signing. The ONLY difference is which backend DEV_BASE_URL points at:
# this workflow sends it to the isolated test backend instead of
# https://api.safetyalrt.com.
#
# DEV_BASE_URL below is a hardcoded literal, not a secret lookup. It was
# originally sourced from a "test" GitHub Environment secret
# (TEST_BACKEND_URL), but four consecutive runs - both API-triggered and
# manually triggered from the GitHub Actions UI - failed with that
# secret resolving empty, despite the environment name, secret placement,
# and branch access all being confirmed correct multiple times over, and
# the secret's value being freshly re-saved. Never diagnosed further, since
# nothing else was checkable from the GitHub settings UI. This URL was never
# actually sensitive in the first place - it's the same class of value as
# the already-public production API hostname - so hardcoding it removes
# the entire failure mode: there is no lookup left to silently return
# empty, and no way for it to resolve to the production URL instead,
# since changing it now requires a reviewed commit to this repo.
#
# Phase 1 TEST APK scope (product-owner decision): Google Sign-In, Google
# Maps, and RevenueCat are all deliberately blanked below so this build
# connects only to the isolated TEST backend and no other external
# production-connected service. Verified before making this change:
# - Google Sign-In's init call is wrapped in a caught async call whose
#   result the app initialization sequence never inspects
#   (auth_repository.dart / app_initialization_provider.dart) - a blank
#   client ID cannot crash app startup, it only leaves Google Sign-In
#   non-functional when tapped. Email/password login is unaffected.
# - RevenueCat is never contacted on this build regardless of its keys,
#   since ALRT_PLUS_TEST_UNLOCK=true (kept below) already short-circuits
#   ensureConfigured() before either key would ever be read
#   (alrt_plus_provider.dart's isAlrtPlusTestUnlocked gate).
# - Firebase (google-services.json) is NOT touched here - it remains the
#   same shared Firebase app the existing [Dev] ALRT build already uses;
#   this workflow has no mechanism to change that (it's a committed file,
#   not an env var).
#
# Manual trigger only (workflow_dispatch) — deliberately does not run on
# push.
#
# billing_mode input (added for RevenueCat Test Store validation):
# - "bypass" (default): unchanged from before this input existed -
#   ALRT_PLUS_TEST_UNLOCK=true, RevenueCat never contacted, blank keys.
#   Every existing/normal TEST build keeps this exact behaviour.
# - "test_store": ALRT_PLUS_TEST_UNLOCK=false (so the app actually calls
#   RevenueCat's ensureConfigured/isPlus instead of bypassing it), and
#   REVENUECAT_API_KEY_GOOGLE is read from the repository-level Secret
#   TEST_REVENUECAT_API_KEY_GOOGLE (Settings > Secrets and variables >
#   Actions > Secrets - not an Environment secret/variable). History:
#   this was originally a "test" Environment Variable (reasoning: it's a
#   publishable RevenueCat SDK key, the same class of value Env.dart's
#   own comment already documents as safe to ship) - changed to a "test"
#   Environment Secret after the first test_store run showed the actual
#   value in that run's log via GitHub Actions' automatic step-level
#   "env:" debug listing, which only masks values sourced from Secrets,
#   never Variables. The Environment Secret then repeatedly resolved
#   empty at build time even after being deleted and re-added fresh
#   (mirroring an earlier unexplained failure with a different
#   Environment secret, TEST_BACKEND_URL, in this same repo - never
#   root-caused). Moved to a repository-level Secret to rule out
#   whatever is specifically wrong with this repo's "test" Environment
#   secret resolution. A guard step refuses the build if test_store is
#   selected but the Secret is empty, so this can never silently fall
#   back to a blank RevenueCat key. REVENUECAT_API_KEY_APPLE stays blank
#   either way - Apple/iOS Test Store testing is a separate later step.
#   test_store also builds --debug instead of --release (see the build
#   step below) - RevenueCat's SDK refuses to initialize a Test Store
#   key in a release build and force-closes the app instead, by design.
name: Android Test Build

on:
  workflow_dispatch:
    inputs:
      billing_mode:
        description: "bypass (default, ALRT_PLUS_TEST_UNLOCK=true) or test_store (real RevenueCat Test Store paywall)"
        required: false
        default: "bypass"
        type: choice
        options:
          - bypass
          - test_store

# The actual Flutter project lives in frontend/, not the repo root, since
# this repo consolidates backend/frontend/admin/askalrt as subdirectories.
# This applies to every `run:` step below (flutter pub get, the .env
# write, flutter build apk) - it does NOT affect actions/checkout,
# actions/setup-java, subosito/flutter-action (none of them read/write
# repo-relative files, so working-directory doesn't apply to them), or
# actions/upload-artifact's `path:` (that one always resolves against the
# checkout root regardless of this default, hence the explicit `frontend/`
# prefix on it below).
defaults:
  run:
    working-directory: frontend

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.10"
          channel: stable
          cache: true

      - run: flutter pub get

      # Only relevant when billing_mode=test_store - see the billing_mode
      # comment at the top of this file. Checks presence by length only;
      # the value itself is never printed. Sourced from a repository-
      # level Secret (not an Environment secret/variable) specifically so
      # GitHub Actions' own automatic step-level "env:" debug listing
      # masks it - see the billing_mode comment at the top of this file
      # for why that distinction matters and why this moved off the
      # "test" Environment entirely.
      - name: Verify the RevenueCat Test Store key is configured
        if: ${{ inputs.billing_mode == 'test_store' }}
        run: |
          if [ -z "$REVENUECAT_API_KEY_GOOGLE" ]; then
            echo "::error::billing_mode=test_store requires the repository Secret TEST_REVENUECAT_API_KEY_GOOGLE to be set (Settings > Secrets and variables > Actions > Secrets)."
            echo "This workflow refuses to build test_store with a blank RevenueCat key - that would silently disable the paywall instead of testing it."
            exit 1
          fi
          echo "REVENUECAT_API_KEY_GOOGLE is set (length: ${#REVENUECAT_API_KEY_GOOGLE} characters). Value itself is never printed."
        env:
          REVENUECAT_API_KEY_GOOGLE: ${{ secrets.TEST_REVENUECAT_API_KEY_GOOGLE }}

      # Google Sign-In and Google Maps are blanked here regardless of
      # billing_mode - see the Phase 1 TEST APK scope comment at the top
      # of this file for why each is safe to blank without breaking app
      # startup. DEV_BASE_URL is the hardcoded isolated TEST backend URL -
      # see the comment at the top of this file for why this is a
      # literal, not a secret lookup. REVENUECAT_API_KEY_GOOGLE and
      # ALRT_PLUS_TEST_UNLOCK depend on billing_mode - see the
      # billing_mode comment at the top of this file.
      - name: Create .env pointed at the isolated test backend
        run: |
          if [ "${{ inputs.billing_mode }}" = "test_store" ]; then
            REVENUECAT_GOOGLE_VALUE="$REVENUECAT_API_KEY_GOOGLE"
            TEST_UNLOCK_VALUE="false"
          else
            REVENUECAT_GOOGLE_VALUE=""
            TEST_UNLOCK_VALUE="true"
          fi
          {
            echo "GOOGLE_OAUTH_SERVER_CLIENT_ID="
            echo "GOOGLE_MAPS_API_KEY="
            echo "MICROSOFT_CLIENT_ID="
            echo "MICROSOFT_TENANT_ID="
            echo "REVENUECAT_API_KEY_APPLE="
            echo "REVENUECAT_API_KEY_GOOGLE=$REVENUECAT_GOOGLE_VALUE"
            echo "DEV_BASE_URL=https://api-test.safetyalrt.com"
            echo "ALRT_PLUS_TEST_UNLOCK=$TEST_UNLOCK_VALUE"
          } > .env
        env:
          REVENUECAT_API_KEY_GOOGLE: ${{ secrets.TEST_REVENUECAT_API_KEY_GOOGLE }}

      # Runs only after .env exists (above): pubspec.yaml declares .env as
      # a Flutter asset (flutter_dotenv), so running this any earlier
      # fails asset bundling with "No file or variants found for asset:
      # .env" before a single test executes - this exact ordering bug
      # broke the first attempt at this step. Fails the job (and skips
      # the build below) on any red test, rather than spending build
      # minutes on a change that didn't pass its own suite. Runs the
      # whole of frontend/test/, not just new files.
      - name: Run flutter test
        run: flutter test

      # Same dev flavour/app id as android-apk.yml - only DEV_BASE_URL
      # and (when billing_mode=test_store) RevenueCat differ, via the
      # .env written above. No GOOGLE_MAPS_API_KEY env var here - Maps is
      # blanked for this Phase 1 TEST APK (see top of file), so nothing
      # reads it.
      #
      # test_store builds --debug, not --release: RevenueCat's SDK only
      # initializes a Test Store API key inside a debug build - a
      # release build (any flavour) using a Test Store key shows a
      # "Wrong API Key" dialog and force-closes itself, by design, so a
      # test key can never accidentally ship to real users. bypass mode
      # never contacts RevenueCat at all, so it keeps building --release
      # unchanged, matching android-apk.yml's real signing story more
      # closely for that path. Flutter's debug output filename differs
      # from release's (app-dev-debug.apk vs app-dev-release.apk), so
      # the actual path is captured via this step's output and consumed
      # by upload-artifact below - it can't be a fixed literal anymore.
      - name: Build the APK (debug for test_store, release for bypass)
        id: build
        run: |
          if [ "${{ inputs.billing_mode }}" = "test_store" ]; then
            flutter build apk --debug --flavor dev -t lib/main_dev.dart
            echo "apk_path=frontend/build/app/outputs/flutter-apk/app-dev-debug.apk" >> "$GITHUB_OUTPUT"
          else
            flutter build apk --release --flavor dev -t lib/main_dev.dart
            echo "apk_path=frontend/build/app/outputs/flutter-apk/app-dev-release.apk" >> "$GITHUB_OUTPUT"
          fi

      # Workflow artifact only - deliberately does NOT publish to the
      # dev-latest GitHub Release android-apk.yml owns, so this can never
      # overwrite the existing production-connected QR-code build. Path
      # comes from the build step's output above (debug vs release
      # filenames differ) - upload-artifact still resolves `path:`
      # against the checkout root regardless of the working-directory
      # default, which is why that output is already prefixed with
      # frontend/. Named per billing_mode so a bypass and a test_store
      # artifact from two different runs are never confused.
      - uses: actions/upload-artifact@v4
        with:
          name: ALRT-android-test-apk-${{ inputs.billing_mode }}
          path: ${{ steps.build.outputs.apk_path }}
          retention-days: 14
