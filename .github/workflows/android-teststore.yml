# Builds a SEPARATE Android APK for testing the real RevenueCat paywall
# through RevenueCat's Test Store, pointed at the ISOLATED INTERNAL-TEST
# backend, not production. This is a NEW, separate workflow file — it
# does not modify android-test.yml (the existing
# ALRT_PLUS_TEST_UNLOCK=true bypass build, unchanged), android-apk.yml,
# or android-release.yml.
#
# Same "dev" flavour/app id (com.safetyalrt.alrt.dev) and same debug
# signing as android-test.yml, so installing this build replaces/updates
# whichever of the two was installed last — they cannot both be on the
# device at once. DEV_BASE_URL is the same hardcoded isolated TEST backend
# literal as android-test.yml, for the same reason documented there (a
# GitHub Environment secret lookup for this value failed unexplained
# across four runs; the URL itself was never sensitive).
#
# The ONLY functional differences from android-test.yml:
# - REVENUECAT_API_KEY_GOOGLE is read from the "test" GitHub Environment's
#   REVENUECAT_API_KEY_GOOGLE Variable (not a Secret - this is a
#   publishable RevenueCat SDK key, the same class of value the app's own
#   Env.dart comment already documents as "safe to ship, not a secret"),
#   pointed at the RevenueCat Test Store app configured for this project.
# - REVENUECAT_API_KEY_APPLE stays blank (Apple/iOS Test Store testing is
#   a separate, later step - not built here).
# - ALRT_PLUS_TEST_UNLOCK=false, so the app actually calls RevenueCat
#   (ensureConfigured/isPlus) instead of short-circuiting past it -
#   alrt_plus_provider.dart's isAlrtPlusTestUnlocked gate only opens when
#   this is exactly "true".
# - Google Sign-In and Google Maps stay blanked, same as android-test.yml
#   and for the same verified-safe reasons (see android-test.yml's own
#   comment) - this build is scoped to RevenueCat Test Store validation
#   only, not a general Maps/Sign-In test.
#
# Manual trigger only (workflow_dispatch) — deliberately does not run on
# push. Refuses to build at all if the RevenueCat Test Store key isn't
# configured, so this can never silently fall back to a blank key.
name: Android TEST Store Build

on:
  workflow_dispatch:

# The actual Flutter project lives in frontend/, not the repo root - see
# android-test.yml's own comment for why this default and the explicit
# frontend/ prefix on upload-artifact's path below are both needed.
defaults:
  run:
    working-directory: frontend

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: test
    steps:
      - uses: actions/checkout@v4

      - name: Verify the RevenueCat Test Store key is configured
        run: |
          if [ -z "$REVENUECAT_API_KEY_GOOGLE" ]; then
            echo "::error::REVENUECAT_API_KEY_GOOGLE is not set as a Variable on the 'test' GitHub Environment."
            echo "This workflow refuses to build with a blank RevenueCat key - that would silently disable the paywall instead of testing it."
            exit 1
          fi
          echo "REVENUECAT_API_KEY_GOOGLE is set (length: ${#REVENUECAT_API_KEY_GOOGLE} characters). Value itself is never printed."
        env:
          REVENUECAT_API_KEY_GOOGLE: ${{ vars.REVENUECAT_API_KEY_GOOGLE }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.10"
          channel: stable
          cache: true

      # Google Sign-In and Google Maps stay blanked - see the header
      # comment above. REVENUECAT_API_KEY_GOOGLE comes from the "test"
      # Environment Variable verified above; REVENUECAT_API_KEY_APPLE
      # stays blank (Apple Test Store testing is a separate later step).
      # ALRT_PLUS_TEST_UNLOCK=false so the app actually exercises
      # RevenueCat instead of bypassing it.
      - name: Create .env pointed at the isolated test backend + RevenueCat Test Store
        run: |
          {
            echo "GOOGLE_OAUTH_SERVER_CLIENT_ID="
            echo "GOOGLE_MAPS_API_KEY="
            echo "MICROSOFT_CLIENT_ID="
            echo "MICROSOFT_TENANT_ID="
            echo "REVENUECAT_API_KEY_APPLE="
            echo "REVENUECAT_API_KEY_GOOGLE=$REVENUECAT_API_KEY_GOOGLE"
            echo "DEV_BASE_URL=https://api-test.safetyalrt.com"
            echo "ALRT_PLUS_TEST_UNLOCK=false"
          } > .env
        env:
          REVENUECAT_API_KEY_GOOGLE: ${{ vars.REVENUECAT_API_KEY_GOOGLE }}

      - run: flutter pub get

      # Same dev flavour/app id as android-test.yml - only the RevenueCat
      # key and the test-unlock flag differ, via the .env written above.
      - run: flutter build apk --release --flavor dev -t lib/main_dev.dart

      # Workflow artifact only - does not publish to any GitHub Release,
      # same as android-test.yml. Named distinctly so it's never confused
      # with the ALRT_PLUS_TEST_UNLOCK=true build's artifact.
      - uses: actions/upload-artifact@v4
        with:
          name: ALRT-android-teststore-apk
          path: frontend/build/app/outputs/flutter-apk/app-dev-release.apk
          retention-days: 14
