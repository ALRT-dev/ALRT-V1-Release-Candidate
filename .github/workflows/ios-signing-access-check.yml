name: iOS TEST signing access check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check existing certificate-repository credential without changing it
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
        run: |
          python3 - <<'PY'
          import os, base64, subprocess
          raw = os.environ.get('MATCH_GIT_BASIC_AUTHORIZATION', '').strip()
          url = os.environ.get('MATCH_GIT_URL', '').strip()
          if not raw or not url:
              raise SystemExit('Existing signing URL or credential is empty')
          try:
              decoded = base64.b64decode(raw, validate=True).decode()
              valid_basic = ':' in decoded
          except Exception:
              valid_basic = False
          is_raw_token = raw.startswith(('ghp_', 'github_pat_', 'gho_'))
          print('Credential format: ' + ('base64 basic' if valid_basic else 'raw GitHub token' if is_raw_token else 'unrecognised'))
          def can_read(auth):
              result = subprocess.run(['git', '-c', 'http.extraHeader=Authorization: Basic '+auth, 'ls-remote', '--exit-code', url, 'HEAD'], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, env={**os.environ, 'GIT_TERMINAL_PROMPT':'0'}, timeout=45)
              return result.returncode == 0
          existing_ok = can_read(raw)
          print('Existing credential can read signing repository: ' + str(existing_ok))
          if not existing_ok and is_raw_token:
              normalised = base64.b64encode(('x-access-token:'+raw).encode()).decode()
              print('Correctly encoded existing token can read repository: ' + str(can_read(normalised)))
          PY
